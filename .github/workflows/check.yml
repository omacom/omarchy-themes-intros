name: Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  stills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: omacom/omarchy-themes-backgrounds
          path: backgrounds
      - run: bin/check backgrounds
